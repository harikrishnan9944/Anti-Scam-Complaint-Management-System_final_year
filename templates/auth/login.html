{% extends "base.html" %}

{% block title %}Account Login{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card-clean shadow-sm border p-4">
                <div class="text-center mb-4">
                    <div class="stat-icon primary mx-auto mb-2" style="width:52px; height:52px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Account Login</h4>
                    <p class="small text-muted">Access your scam complaints portal</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label mb-0">Password <span class="required">*</span></label>
                        </div>
                        <input type="password" class="form-control mt-1" id="password" name="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary-navy w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                    </button>
                </form>

                <div class="text-center pt-2 border-top">
                    <span class="small text-muted">Don't have an account? </span>
                    <a href="{{ url_for('register') }}" class="small fw-semibold">Register here</a>
                </div>

                <!-- Demo Login Credentials Helper -->
                <div class="mt-4 p-3 bg-light rounded border text-start">
                    <div class="fw-bold text-dark small mb-1"><i class="bi bi-info-circle text-primary me-1"></i> Demo Credentials:</div>
                    <div class="small text-muted">
                        <strong>User:</strong> <code>rahul.sharma@example.com</code> / <code>user123</code><br>
                        <strong>Admin:</strong> <code>admin@antiscam.gov</code> / <code>admin123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
